name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tonyedgal/anti-slop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm check && pnpm check:packaging-types && pnpm lint:packaging && pnpm fmt:packaging:check
      - name: Create release pull request or publish to npm
        uses: changesets/action@v2.0.0-next.3
        with:
          publish-script: pnpm release:publish
          version-script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
          push-git-tags: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: .release/
          if-no-files-found: ignore
